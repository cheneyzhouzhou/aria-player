name: Build Aria

# Builds Aria on a GitHub-hosted macOS runner, so no local Xcode is needed.
# Every push produces downloadable build artifacts; pushing a tag like v29
# additionally publishes a GitHub Release with the unsigned IPA and BOTH
# macOS flavours (arm64-only and universal) attached.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build iOS app for device (unsigned)
        run: |
          xcodebuild \
            -project Aria.xcodeproj \
            -scheme Aria \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package iOS app into an unsigned IPA
        run: |
          APP="build/dd/Build/Products/Release-iphoneos/Aria.app"
          test -d "$APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          # An unsigned device build still needs a code directory for most
          # sideloading tools to re-sign it cleanly.
          codesign --force --sign - --timestamp=none build/Payload/Aria.app || true
          cd build && zip -qry Aria.ipa Payload

      - name: Build macOS app (arm64 + universal)
        env:
          # On tag builds the release number comes from the tag; on ordinary
          # pushes it falls back to the VERSION file in the repo.
          ARIA_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          # build.sh compiles both architectures, lipo-combines them, assembles
          # two bundles and writes two versioned zips. Keeping the recipe in one
          # script means local builds and CI can never drift apart.
          ./build.sh
          ls -lh build/Aria-v*-macOS*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Aria-unsigned-ipa
          path: build/Aria.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Aria-macOS-arm64
          path: build/Aria-v*-macOS.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Aria-macOS-universal
          path: build/Aria-v*-macOS-universal.zip
          if-no-files-found: error

      - name: Publish release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          ARM_ZIP="build/Aria-v${VER}-macOS.zip"
          UNIVERSAL_ZIP="build/Aria-v${VER}-macOS-universal.zip"
          test -f "$ARM_ZIP" || { echo "missing $ARM_ZIP" >&2; exit 1; }
          test -f "$UNIVERSAL_ZIP" || { echo "missing $UNIVERSAL_ZIP" >&2; exit 1; }
          # Prefer a hand-written release note for this tag; fall back to
          # GitHub's generated notes when there isn't one.
          NOTES_FILE="release-notes/${TAG}.md"
          ARGS=(
            "$TAG"
            "build/Aria.ipa#Aria-${TAG}.ipa"
            "${ARM_ZIP}#Aria-${TAG}-macOS.zip"
            "${UNIVERSAL_ZIP}#Aria-${TAG}-macOS-universal.zip"
            --title "Aria ${TAG}"
          )
          if [ -f "$NOTES_FILE" ]; then
            ARGS+=( --notes-file "$NOTES_FILE" )
          else
            ARGS+=( --generate-notes )
          fi
          gh release create "${ARGS[@]}" \
            || gh release upload "$TAG" build/Aria.ipa "$ARM_ZIP" "$UNIVERSAL_ZIP" --clobber
